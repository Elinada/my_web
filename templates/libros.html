<head>
    <title>Book Management System</title>
    <link rel="stylesheet" 
    href="{{ url_for('static', filename='style.css') }}">
</head>

<h1>Welcome</h1>
<p>BOOK reading SYSTEM</p>

<ul>
    {% for boo in books %}
        <li> {{ boo[1] }} by {{boo[2]}}
            <a href="{{ url_for('edit_book', id=boo[0]) }}">
                Edit
            </a>
    
            <form action="{{ url_for('delete_book', id=boo[0]) }}" method="post"
             style="display:inline;">
                <button 
                    class="delete-btn"
                    type="submit" 
                    onclick = "return confirm('Delete the book {{boo[1]}} by {{boo[2]}} ?')">
                    Delete
                </button>
            </form>
        </li>
    {% endfor %}
</ul>

   <button class="add-btn"
   onclick="window.location.href='{{ url_for('books') }}'">
        Add Books!
    </button>
