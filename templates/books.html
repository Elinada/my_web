
<head>
    <title>Book Management System</title>
    <link rel="stylesheet" 
    href="{{ url_for('static', filename='style.css') }}">
</head>
<a class="back-link" href="{{ url_for('home') }}">&larr; Ir al inicio</a>

<h1> Add a new book now:</h1>
{% if error %}
    <p style="color: red;">{{ error }}</p>
{% endif %}

<form method="POST" action="/books">
    <label for="title">Title :</label>
    <input type="text" id="title" name="title" required>
    <br>
    <label for="author">Authors :</label>
    <input type="text" id="author" name="author" required>
    <br>
    <button type="submit" 
    <!-- Your comment here onclick="return confirm('Add this book: ' + document.getElementById('title').value +' by '+ document.getElementById('author').value + '?' -->
        onclick= return "Book added">  Add it!</button>
</form>



<button class="home-btn"
onclick="window.location.href='{{ url_for('home') }}'">
    Go home
</button>
