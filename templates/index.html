
<h1>Welcome</h1>
<p>BOOK MANAGMENT SYSTEM</p>

<ul>
    {% for boo in books %}
        <p> {{ boo[1] }} by {{boo[2]}}
            <a href="{{ url_for('edit_book', id=boo[0]) }}">
                Edit
            </a>
    
            <form action="{{ url_for('delete_book', id=boo[0]) }}" method="post" style="display:inline;">
                <button 
                    type="submit" 
                    #
                    onclick = "return confirm('Delete the book {{boo[1]}} by {{boo[2]}} ?')">
                    Delete book!
                </button>
            </form>
        </p>
    {% endfor %}
</ul>

   <button onclick="window.location.href='{{ url_for('books') }}'">
        Add Books!
    </button>
